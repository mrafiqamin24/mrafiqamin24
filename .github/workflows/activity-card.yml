name: Activity card

on:
  schedule:
    - cron: "17 19 * * *" # 02:17 WIB
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-card
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install fontTools (text outlines for the card)
        run: python3 -m pip install --quiet "fonttools>=4.50"

      - name: Render card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/stats.py

      - name: Commit when the card changed
        run: |
          if git diff --quiet -- assets; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh activity card"
          git push
